name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download dependencies
        shell: powershell
        run: ./setup.ps1
      - name: Regression and UI checks
        shell: powershell
        run: ./build.ps1 -Test -UiTest
      - name: Save screen previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-previews
          path: .build/ui-preview/*.png
